<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clauree ⚡ — AI Optimization Suite for Claude</title>
    <style>
        :root {
            --bg-primary: #0f172a; --bg-secondary: #1e293b;
            --accent: #6366f1; --accent-hover: #4f46e5;
            --text-main: #f8fafc; --text-muted: #94a3b8; --border: #334155;
        }
        body { font-family: system-ui, sans-serif; background: var(--bg-primary); color: var(--text-main); margin: 0; padding: 2rem; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { width: 100%; max-width: 600px; background: var(--bg-secondary); padding: 2.5rem; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); text-align: center; }
        .logo { width: 80px; height: 80px; object-fit: cover; border-radius: 50%; border: 2px solid var(--accent); margin-bottom: 1rem; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
        h1 { margin-top: 0; font-size: 2rem; color: #fff; }
        p { color: var(--text-muted); line-height: 1.5; }
        .bookmarklet-box { background: #0b0f19; padding: 1.5rem; border-radius: 12px; border: 1px dashed var(--border); margin: 1.5rem 0; }
        .bookmarklet-btn { display: inline-block; padding: 14px 28px; background: var(--accent); color: white; border-radius: 8px; text-decoration: none; font-weight: bold; cursor: grab; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4); }
        .config-section { text-align: left; margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1.5rem; }
        .config-section label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; }
        .config-section input { width: 100%; padding: 10px; border-radius: 6px; background: #0f172a; border: 1px solid var(--border); color: #fff; box-sizing: border-box; font-family: monospace; }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://i.postimg.cc/CKQDjDyk/5aebc1b8-4fe4-418c-9720-20abdf0244eb.webp" alt="Clauree Logo" class="logo">
        <h1>Clauree Suite ⚡</h1>
        <p>Your lightweight, bookmarklet-based AI optimization suite for Claude AI, managed securely via Wispbyte backend infrastructure.</p>

        <div class="bookmarklet-box">
            <p style="margin-top: 0; font-size: 0.9rem; color: #cbd5e1;">Drag this button to your bookmarks toolbar:</p>
            <a class="bookmarklet-btn" id="main-bookmarklet" href="#">⚡ Clauree v1.0</a>
        </div>

        <div class="config-section">
            <label for="backend-url">Wispbyte Backend API Endpoint:</label>
            <input type="text" id="backend-url" value="https://clauree-backend.wispbyte.app:14479" placeholder="Enter Wispbyte endpoint...">
        </div>
    </div>

    <script>
        const backendInput = document.getElementById('backend-url');
        const bookmarkletLink = document.getElementById('main-bookmarklet');

        function updateBookmarklet() {
            const endpoint = backendInput.value.trim().replace(/\/+$/, '');
            const payloadCode = `(function(){
                if(document.getElementById('clauree-root')) return alert('Clauree is already active!');
                window.CLAUREE_API = ${JSON.stringify(endpoint)};
                const root = document.createElement('div');
                root.id = 'clauree-root';
                root.innerHTML = '<div id="clauree-panel"><div style="display:flex;justify-content:space-between;align-items:center"><span>Clauree Suite ⚡</span><button id="clauree-close" style="background:none;border:0;color:#fff;font-size:18px;cursor:pointer">&times;</button></div><div style="margin-top:8px"><strong id="clauree-status">Checking backend…</strong></div></div><style>#clauree-panel{position:fixed;bottom:20px;right:20px;width:280px;background:#0f172a;color:#fff;padding:12px;border-radius:8px;z-index:999999;border:1px solid #334155;font-family:sans-serif;}</style>';
                document.body.appendChild(root);
                document.getElementById('clauree-close').onclick = function(){ root.remove(); };
                var st = document.getElementById('clauree-status');
                fetch(window.CLAUREE_API + '/health')
                    .then(function(r){ if(!r.ok) throw new Error(r.status); st.textContent = 'Connected to Wispbyte 🟢'; })
                    .catch(function(e){ st.textContent = 'Backend unreachable 🔴 (' + e.message + ')'; });
            })();`;
            bookmarkletLink.href = "javascript:" + encodeURIComponent(payloadCode);
        }
        backendInput.addEventListener('input', updateBookmarklet);
        updateBookmarklet();

        // Live status check for the endpoint on this page
        const statusEl = document.createElement('p');
        statusEl.style.cssText = 'margin:0.75rem 0 0;font-size:0.85rem';
        document.querySelector('.config-section').appendChild(statusEl);
        async function checkBackend() {
            const url = backendInput.value.trim().replace(/\/+$/, '');
            statusEl.textContent = 'Checking…';
            try {
                const r = await fetch(url + '/health');
                if (!r.ok) throw new Error('HTTP ' + r.status);
                statusEl.textContent = '🟢 Backend online';
            } catch (e) {
                statusEl.textContent = '🔴 Backend unreachable (' + e.message + ') — check the port and http vs https';
            }
        }
        backendInput.addEventListener('change', checkBackend);
        checkBackend();
    </script>
</body>
</html>
